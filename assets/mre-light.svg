<svg xmlns="http://www.w3.org/2000/svg" width="392" height="242" viewBox="0 0 392 242" role="img" aria-labelledby="title desc"><title id="title">MRE</title><desc id="desc">Can software bugs be reproduced with less manual effort? A team project that generates reproduction scripts and checks their behavior against buggy and fixed code. Python, Docker, SWE-bench Lite</desc><rect x="1" y="1" width="390" height="240" rx="12" fill="#ffffff" stroke="#d8dee7"/><text x="23" y="38" fill="#20242c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">MRE</text><path d="M350 23h18v18M368 23l-16 16" stroke="#4d50ac" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="72" fill="#20242c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Can software bugs be reproduced</text><text x="23" y="96" fill="#20242c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">with less manual effort?</text><text x="23" y="127" fill="#424b5a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">A team project that generates reproduction</text><text x="23" y="148" fill="#424b5a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">scripts and checks their behavior against buggy</text><text x="23" y="169" fill="#424b5a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">and fixed code.</text><path d="M23 202H369" fill="none" stroke="#e1e5ed"/><text x="23" y="225" fill="#596575" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Python, Docker, SWE-bench Lite</text></svg>

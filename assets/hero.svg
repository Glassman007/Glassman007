<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img"><title>Aditya Karki. Software engineering, AI systems and applied data. Building software that turns fragmented information into usable decisions; backend architecture, graph retrieval, agentic workflows and data verification.</title><rect x="1" y="1" width="998" height="366" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="32" y="34" fill="#8b949e" font-family="monospace" font-size="15" font-weight="600" >PERSONAL DOSSIER  /  GLASSMAN007</text><text x="968" y="34" fill="#8b949e" font-family="monospace" font-size="15" font-weight="400" text-anchor="end">ENGINEERING INDEX</text><path d="M32 49H968" stroke="#30363d"/><text x="32" y="112" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="61" font-weight="700" >ADITYA KARKI.</text><text x="34" y="151" fill="#8b949e" font-family="Arial, sans-serif" font-size="25" font-weight="400" >Software engineering / AI systems / applied data</text><text x="34" y="193" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="23" font-weight="400" >I build software that turns fragmented information into usable decisions.</text><text x="34" y="224" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="23" font-weight="400" >My work explores backend architecture, graph-based retrieval, agentic</text><text x="34" y="255" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="23" font-weight="400" >workflows and data verification — with an emphasis on testable behavior.</text><path d="M32 280H968" stroke="#30363d"/><text x="34" y="310" fill="#8b949e" font-family="monospace" font-size="15" font-weight="600" >01  SYSTEMS</text><text x="34" y="339" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="400" >APIs • data stores • reliability</text><path d="M324 295L324 350" stroke="#30363d"/><text x="349" y="310" fill="#8b949e" font-family="monospace" font-size="15" font-weight="600" >02  INTELLIGENCE</text><text x="349" y="339" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="400" >ML • agents • evaluation</text><path d="M639 295L639 350" stroke="#30363d"/><text x="664" y="310" fill="#8b949e" font-family="monospace" font-size="15" font-weight="600" >03  TRUST</text><text x="664" y="339" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Evidence • provenance • audit</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="392" height="242" viewBox="0 0 392 242" role="img" aria-labelledby="title desc"><title id="title">NODUS</title><desc id="desc">What breaks when an enterprise system changes? Connects enterprise records in a relationship graph to trace dependencies and retrieve evidence for investigations. FastAPI, Neo4j, PostgreSQL</desc><rect x="1" y="1" width="390" height="240" rx="12" fill="#131720" stroke="#30363f"/><text x="23" y="38" fill="#f0f3fa" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">NODUS</text><path d="M350 23h18v18M368 23l-16 16" stroke="#a9aaff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="72" fill="#f0f3fa" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">What breaks when an enterprise</text><text x="23" y="96" fill="#f0f3fa" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">system changes?</text><text x="23" y="127" fill="#b9c1cf" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Connects enterprise records in a relationship</text><text x="23" y="148" fill="#b9c1cf" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">graph to trace dependencies and retrieve</text><text x="23" y="169" fill="#b9c1cf" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">evidence for investigations.</text><path d="M23 202H369" fill="none" stroke="#303642"/><text x="23" y="225" fill="#a2aab9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">FastAPI, Neo4j, PostgreSQL</text></svg>
